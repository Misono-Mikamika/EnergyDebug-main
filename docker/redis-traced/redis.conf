# Redis基础配置
bind 0.0.0.0
port 6379
daemonize no
pidfile /var/run/redis.pid
logfile /var/log/redis.log
dir /var/lib/redis

# 内存设置
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化
save 900 1
save 300 10
save 60 10000

# 安全设置
requirepass EnergyDebug2024

# 性能优化
timeout 0
tcp-keepalive 300

# 日志级别
loglevel notice

# 数据文件
dbfilename dump.rdb
